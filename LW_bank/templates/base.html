<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bank{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; }
        header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #0055aa; }
        table { border-collapse: collapse; width: 100%; margin: 15px 0; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .error { color: #b00020; }
        form label { display: block; margin-top: 8px; }
        input, select, button { padding: 5px; margin-top: 3px; }
    </style>
</head>
<body>
    <header>
        <h1>F - Bank</h1>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('add_account') }}">Open Account</a>
            <a href="{{ url_for('transfer') }}">Transfer</a>
        </nav>
    </header>

    {% block content %}{% endblock %}
</body>
</html>

{% extends "base.html" %}

{% block title %}Edit — Bank{% endblock %}

{% block content %}
<h2>Редактирование аккаунта №{{ account.id }}</h2>

{% if errors %}
    <ul class="error">
        {% for e in errors %}
            <li>{{ e }}</li>
        {% endfor %}
    </ul>
{% endif %}

<form action="{{ url_for('edit_account', account_id=account.id) }}" method="POST">
    <label>Имя:
        <input type="text" name="holder" value="{{ holder }}">
    </label>

    <label>Номер карты:
        <input type="text" name="card" value="{{ card }}">
    </label>

    <label>Баланс:
        <input type="number" name="balance" step="0.01" value="{{ balance }}">
    </label>

    <button type="submit">Сохранить</button>
</form>

<p><a href="{{ url_for('detail', account_id=account.id) }}">Отмена</a></p>
{% endblock %}
